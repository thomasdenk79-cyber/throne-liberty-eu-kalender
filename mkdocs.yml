site_name: Linny's Astral Solisium Pulse – Hilfe und Entwicklerdoku
site_description: Anwenderhilfe und Projektgedaechtnis fuer KI-gestuetzte Entwicklung
site_author: Thomas Denk

docs_dir: docs
site_dir: site
use_directory_urls: true

repo_name: thomasdenk79-cyber/throne-liberty-eu-kalender
repo_url: https://github.com/thomasdenk79-cyber/throne-liberty-eu-kalender
edit_uri: edit/main/docs/

theme:
  name: mkdocs

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: true

nav:
  - Start: README.md
  - Anwenderhilfe:
    - Schnellstart: user/quickstart.md
    - Konfiguration und Import/Export: user/configuration.md
    - FAQ: user/faq.md
  - Entwicklerdoku:
    - Projektueberblick: project/project-brief.md
    - Architektur: project/architecture.md
    - Entwicklungsrichtlinien: engineering/development-guidelines.md
    - KI-gestuetzte Entwicklung: engineering/ai-assisted-development.md
    - Dokumentationsrichtlinien: engineering/documentation-guidelines.md
    - Entscheidungsprotokoll: engineering/decision-log.md
    - Markdown-Kurzreferenz: reference/markdown-cheatsheet.md
    - Vorstellung fuer Kollegen: demo/colleague-demo.md
    - Prompt-Beispiele: demo/prompt-examples.md
