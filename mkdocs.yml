site_name: Linny's Epic Time Portal – Hilfe und Entwicklerdoku
site_description: Anwenderhilfe und Projektgedaechtnis fuer KI-gestuetzte Entwicklung
site_author: Thomas Denk

docs_dir: docs
site_dir: site
use_directory_urls: true

repo_name: thomasdenk79-cyber/throne-liberty-eu-kalender
repo_url: https://github.com/thomasdenk79-cyber/throne-liberty-eu-kalender
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  logo: assets/linny/linny-icon.png
  favicon: assets/linny/linny-icon.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Helles Design
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dunkles Design

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/linny.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thomasdenk79-cyber/throne-liberty-eu-kalender
      name: Projekt auf GitHub

nav:
  - Start: README.md
  - Projektstatus:
    - Changelog: project/changelog.md
    - Taskboard: project/taskboard.md
    - Rollen und Governance: project/team-governance.md
  - Anwenderhilfe:
    - Was ist neu?: user/whats-new.md
    - Schnellstart: user/quickstart.md
    - Konfiguration und Import/Export: user/configuration.md
    - FAQ: user/faq.md
  - Entwicklerdoku:
    - Projektueberblick: project/project-brief.md
    - Architektur: project/architecture.md
    - Entwicklungsrichtlinien: engineering/development-guidelines.md
    - KI-gestuetzte Entwicklung: engineering/ai-assisted-development.md
    - Dokumentationsrichtlinien: engineering/documentation-guidelines.md
    - Designsystem und UX: engineering/design-system.md
    - Discord-Webhook: engineering/discord-integration.md
    - Entscheidungsprotokoll: engineering/decision-log.md
    - Markdown-Kurzreferenz: reference/markdown-cheatsheet.md
    - Vorstellung fuer Kollegen: demo/colleague-demo.md
    - Prompt-Beispiele: demo/prompt-examples.md
