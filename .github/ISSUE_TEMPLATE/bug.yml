name: Fehler melden
description: Reproduzierbaren Fehler im Portal oder in der Dokumentation melden
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Beobachtetes Verhalten
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduktion
      description: Schritte, Browser, Betriebssystem und App-/Browsermodus
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Nachweise
      description: Fehlermeldung, Screenshot oder relevante Testausgabe ohne Secrets
