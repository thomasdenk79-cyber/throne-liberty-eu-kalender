name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Refresh restart-sensitive live timers
        run: python scripts/sync_gate_memory.py

      - name: Build MkDocs help site
        run: mkdocs build --clean --site-dir .pages/help

      - name: Assemble Pages artifact
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          cp config.ini .pages/config.ini
          cp live-timers.ini .pages/live-timers.ini
          cp manifest.webmanifest .pages/manifest.webmanifest
          cp service-worker.js .pages/service-worker.js
          cp -R assets .pages/assets
          if [ -f 404.html ]; then cp 404.html .pages/404.html; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
