name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  application-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m py_compile scripts/sync_gate_memory.py
      - run: python -m json.tool manifest.webmanifest > /dev/null

  documentation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install --requirement requirements-docs.txt
      - run: mkdocs build --strict

  deploy:
    needs:
      - application-check
      - documentation-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --requirement requirements-docs.txt

      - name: Refresh restart-sensitive live timers
        run: python scripts/sync_gate_memory.py

      - name: Build MkDocs help site
        run: mkdocs build --strict --clean --site-dir .pages/help

      - name: Assemble Pages artifact
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          cp config.ini .pages/config.ini
          cp live-timers.ini .pages/live-timers.ini
          cp manifest.webmanifest .pages/manifest.webmanifest
          cp service-worker.js .pages/service-worker.js
          cp -R assets .pages/assets
          if [ -f 404.html ]; then cp 404.html .pages/404.html; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
